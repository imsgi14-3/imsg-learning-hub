<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMSG Learning Hub - Test Suite</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
        h1 { text-align: center; margin-bottom: 10px; color: #818cf8; }
        .subtitle { text-align: center; color: #94a3b8; margin-bottom: 30px; }
        .test-summary { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; text-align: center; }
        .test-summary h2 { margin-bottom: 10px; }
        .pass-text { color: #10b981; font-weight: 600; font-size: 1.2rem; }
        .fail-text { color: #ef4444; font-weight: 600; font-size: 1.2rem; }
        .test-suite { background: #1e293b; border-left: 4px solid #818cf8; padding: 12px 16px; margin: 15px 0 5px; border-radius: 0 8px 8px 0; }
        .test-suite h3 { color: #818cf8; font-size: 1rem; }
        .test-result { padding: 8px 16px; margin: 2px 0; border-radius: 6px; font-size: 0.85rem; font-family: monospace; }
        .test-result.pass { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .test-result.fail { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 0.9rem; cursor: pointer; margin: 4px; font-weight: 600; }
        .btn-primary { background: #818cf8; color: white; }
        .btn-primary:hover { background: #6366f1; }
        .btn-all { background: #10b981; color: white; font-size: 1rem; padding: 12px 28px; }
        .btn-all:hover { background: #059669; }
        .controls { text-align: center; margin-bottom: 20px; }
        #results { max-width: 900px; margin: 0 auto; }
        .stats { display: flex; gap: 20px; justify-content: center; margin: 15px 0; }
        .stat { background: #1e293b; padding: 15px 25px; border-radius: 10px; text-align: center; min-width: 100px; }
        .stat-value { font-size: 1.8rem; font-weight: 700; }
        .stat-label { font-size: 0.8rem; color: #94a3b8; margin-top: 4px; }
        .stat.pass .stat-value { color: #10b981; }
        .stat.fail .stat-value { color: #ef4444; }
        .stat.total .stat-value { color: #818cf8; }
        .fail-box { background: rgba(239, 68, 68, 0.12); border: 1px solid #ef4444; border-radius: 10px; padding: 14px 18px; margin: 15px 0; }
        .fail-box h2 { color: #ef4444; font-size: 1.05rem; margin-bottom: 8px; }
        .fail-box ul { list-style: none; }
        .fail-box li { padding: 4px 0; font-size: 0.85rem; line-height: 1.4; }
        .fail-box a { color: #fecaca; text-decoration: underline; cursor: pointer; }
        .fail-box a b { color: #fff; }
        .flash { outline: 2px solid #f59e0b; outline-offset: 2px; }
        .bank-warn { background: rgba(239, 68, 68, 0.15); border: 1px dashed #ef4444; border-radius: 8px; padding: 10px 14px; margin-top: 10px; font-size: 0.88rem; color: #fecaca; text-align: left; }
    </style>
</head>
<body>
    <h1>IMSG Learning Hub - Test Suite</h1>
    <p class="subtitle">Comprehensive automated tests for the learning platform</p>

    <div class="controls">
        <button class="btn btn-all" onclick="runAllTests()">&#9654; Run All Tests</button>
        <button class="btn btn-primary" onclick="runSingle('auth')">Auth</button>
        <button class="btn btn-primary" onclick="runSingle('students')">Students</button>
        <button class="btn btn-primary" onclick="runSingle('teachers')">Teachers</button>
        <button class="btn btn-primary" onclick="runSingle('quiz')">Quiz</button>
        <button class="btn btn-primary" onclick="runSingle('questions')">Questions</button>
        <button class="btn btn-primary" onclick="runSingle('analytics')">Analytics</button>
        <button class="btn btn-primary" onclick="runSingle('recommendations')">Recommendations</button>
        <button class="btn btn-primary" onclick="runSingle('assignments')">Assignments</button>
        <button class="btn btn-primary" onclick="runSingle('examengine')">Exam Engine</button>
        <button class="btn btn-primary" onclick="runSingle('persistence')">Persistence</button>
    </div>

    <div id="results">
        <div class="test-summary"><h2>Loading...</h2><p>Initializing scripts...</p></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="../firebase-config.js"></script>
    <script src="../xlsx.full.min.js"></script>
    <script src="../db.js"></script>
    <script src="../data.js"></script>
    <script src="../auth.js"></script>
    <script src="../analytics.js"></script>
    <script>var QUESTION_BANK_BASE = "../";</script>
    <script src="../examEngine.js"></script>
    <script src="../ui.js"></script>
    <script src="../quiz.js"></script>
    <script src="../recommendations.js"></script>
    <script src="../questionLoader.js"></script>
    <script src="test-utils.js"></script>
    <script src="auth-tests.js"></script>
    <script src="student-tests.js"></script>
    <script src="teacher-tests.js"></script>
    <script src="quiz-tests.js"></script>
    <script src="question-tests.js"></script>
    <script src="analytics-tests.js"></script>
    <script src="recommendations-tests.js"></script>
    <script src="assignment-tests.js"></script>
    <script src="exam-engine-tests.js"></script>
    <script src="data-tests.js"></script>
    <script>
        var appReady = false;

        window.addEventListener("load", function() {
            try {
                LocalDB.open(function() {
                    try { LocalDB.migrateFromLocalStorage(); } catch(e) {}
                    loadData();
                    if (typeof QuestionLoader !== "undefined") {
                        QuestionLoader.loadAllChapters(function(allQs) {
                            if (allQs && allQs.length > 0) {
                                var jsonById = {};
                                for (var i = 0; i < allQs.length; i++) jsonById[allQs[i].id] = allQs[i];
                                var cleaned = [];
                                for (var i = 0; i < questions.length; i++) {
                                    if (jsonById[questions[i].id]) cleaned.push(jsonById[questions[i].id]);
                                    else if (!questions[i].subject || !questions[i].chapter) cleaned.push(questions[i]);
                                }
                                for (var i = 0; i < allQs.length; i++) {
                                    var found = false;
                                    for (var j = 0; j < cleaned.length; j++) { if (cleaned[j].id === allQs[i].id) { found = true; break; } }
                                    if (!found) cleaned.push(allQs[i]);
                                }
                                questions = cleaned;
                            }
                            appReady = true;
                            var qCount = questions.length;
                            var warn = "";
                            if (qCount < 2800) {
                                warn = '<div class="bank-warn">&#9888; Only ' + qCount + ' questions loaded, but the full bank has 3154 (Computer Science 1506 + Chemistry 1648). ' +
                                    'The question bank JSON did not load. Open this page through Live Server (not file://), then hard-refresh (Ctrl+Shift+R). ' +
                                    'Console (F12) must show "Loaded ... questions from Chapter 1" through "Chapter 19 (Chemistry)".</div>';
                            }
                            document.getElementById("results").innerHTML = '<div class="test-summary"><h2>Ready</h2><p>' + qCount + ' questions loaded. Click "Run All Tests" to start.</p>' + warn + '</div>';
                        });
                    } else {
                        appReady = true;
                        document.getElementById("results").innerHTML = '<div class="test-summary"><h2>Ready</h2><p>Click "Run All Tests" to start.</p></div>';
                    }
                });
            } catch(e) {
                appReady = true;
                document.getElementById("results").innerHTML = '<div class="test-summary"><h2>Ready</h2><p>DB init skipped. Click "Run All Tests".</p></div>';
            }
        });

        function runAllTests() {
            if (!appReady) { alert("Still loading, please wait..."); return; }
            var result = TestRunner.run(function() {
                try { runAuthTests(); } catch(e) { TestRunner.suite("Auth"); TestRunner.assert(false, "CRASHED: " + e.message); }
                try { runStudentTests(); } catch(e) { TestRunner.suite("Students"); TestRunner.assert(false, "CRASHED: " + e.message); }
                try { runTeacherTests(); } catch(e) { TestRunner.suite("Teachers"); TestRunner.assert(false, "CRASHED: " + e.message); }
                try { runQuizTests(); } catch(e) { TestRunner.suite("Quiz"); TestRunner.assert(false, "CRASHED: " + e.message); }
                try { runQuestionTests(); } catch(e) { TestRunner.suite("Questions"); TestRunner.assert(false, "CRASHED: " + e.message); }
                try { runAnalyticsTests(); } catch(e) { TestRunner.suite("Analytics"); TestRunner.assert(false, "CRASHED: " + e.message); }
                try { runTeacherAnalyticsFlowTests(); } catch(e) { TestRunner.suite("Teacher Analytics Flow"); TestRunner.assert(false, "CRASHED: " + e.message); }
                try { runRecommendationTests(); } catch(e) { TestRunner.suite("Recommendations"); TestRunner.assert(false, "CRASHED: " + e.message); }
                try { runAssignmentTests(); } catch(e) { TestRunner.suite("Assignments"); TestRunner.assert(false, "CRASHED: " + e.message); }
                try { runExamEngineTests(); } catch(e) { TestRunner.suite("Exam Engine"); TestRunner.assert(false, "CRASHED: " + e.message); }
                try { runPersistenceTests(); } catch(e) { TestRunner.suite("Persistence"); TestRunner.assert(false, "CRASHED: " + e.message); }
            });
            showResults(result);
        }

        function runSingle(test) {
            if (!appReady) { alert("Still loading, please wait..."); return; }
            var fnMap = {
                auth: runAuthTests, students: runStudentTests, teachers: runTeacherTests,
                quiz: runQuizTests, questions: runQuestionTests, analytics: runAnalyticsTests,
                teacheranalyticsflow: runTeacherAnalyticsFlowTests,
                recommendations: runRecommendationTests,
                assignments: runAssignmentTests,
                examengine: runExamEngineTests,
                persistence: runPersistenceTests
            };
            var result = TestRunner.run(function() {
                try { fnMap[test](); } catch(e) {
                    TestRunner.suite(test);
                    TestRunner.assert(false, "CRASHED: " + e.message);
                }
            });
            showResults(result);
        }

        function showResults(result) {
            var cls = result.failed === 0 ? "pass" : "fail";
            var html = '<div class="stats">' +
                '<div class="stat total"><div class="stat-value">' + result.total + '</div><div class="stat-label">Total</div></div>' +
                '<div class="stat pass"><div class="stat-value">' + result.passed + '</div><div class="stat-label">Passed</div></div>' +
                '<div class="stat fail"><div class="stat-value">' + result.failed + '</div><div class="stat-label">Failed</div></div>' +
                '</div>' +
                '<div class="test-summary"><h2>' + (result.failed === 0 ? 'All Tests Passed!' : result.failed + ' Test(s) Failed') + '</h2>' +
                '<p class="' + cls + '-text">' + result.passed + '/' + result.total + ' passed</p></div>';

            var failList = [];
            for (var i = 0; i < result.results.length; i++) {
                var r = result.results[i];
                if (r.type === "fail") failList.push({ suite: r.suite || "", test: r.test, idx: i });
            }
            if (failList.length > 0) {
                html += '<div class="fail-box" id="failBox"><h2>&#10007; ' + failList.length + ' failed &mdash; click to jump</h2><ul>';
                for (var f = 0; f < failList.length; f++) {
                    html += '<li><a href="#line' + failList[f].idx + '" onclick="jumpToFail(event, \'line' + failList[f].idx + '\')"><b>' + failList[f].suite + '</b> &mdash; ' + failList[f].test + '</a></li>';
                }
                html += '</ul></div>';
            }

            for (var i = 0; i < result.results.length; i++) {
                var r = result.results[i];
                if (r.type === "suite") {
                    html += '<div class="test-suite"><h3>' + r.name + '</h3></div>';
                } else {
                    var icon = r.type === "pass" ? "&#10003;" : "&#10007;";
                    html += '<div class="test-result ' + r.type + '" id="line' + i + '">' + icon + ' ' + r.test + '</div>';
                }
            }

            document.getElementById("results").innerHTML = html;
            var failBox = document.getElementById("failBox");
            if (failBox) failBox.scrollIntoView({ behavior: "smooth", block: "center" });
        }

        function jumpToFail(e, id) {
            e.preventDefault();
            var el = document.getElementById(id);
            if (!el) return;
            el.scrollIntoView({ behavior: "smooth", block: "center" });
            el.classList.add("flash");
            setTimeout(function() { el.classList.remove("flash"); }, 2000);
        }
    </script>
</body>
</html>
